<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0b0b0c" />
        <title>Scale — Worker Capture</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.production.min.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
        <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
        <style>
            :root {
                --bg: #0b0b0c;
                --s1: #131315;
                --s2: #1a1a1d;
                --s3: #222226;
                --line: rgba(255, 255, 255, 0.08);
                --line2: rgba(255, 255, 255, 0.14);
                --text: #f2f0ea;
                --muted: #8b8b90;
                --faint: #55555a;
                --accent: #e8e4da;
                --danger: #e5484d;
                --r: 14px;
                --serif: "Instrument Serif", Georgia, serif;
                --sans: "Space Grotesk", -apple-system, sans-serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body,
            #root {
                height: 100%;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
                overscroll-behavior: none;
            }
            button {
                font-family: inherit;
                cursor: pointer;
                border: none;
                background: none;
                color: inherit;
            }
            input {
                font-family: inherit;
            }
            .app {
                height: 100%;
                display: flex;
                flex-direction: column;
                max-width: 520px;
                margin: 0 auto;
                position: relative;
            }
            @media (min-width: 560px) {
                .app {
                    border: 0 solid var(--line);
                    border-width: 0 1px;
                }
            }
            .header {
                padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px 18px;
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
            }
            .brand {
                font-family: var(--serif);
                font-size: 30px;
                line-height: 1;
            }
            .brand small {
                display: block;
                font-family: var(--sans);
                font-size: 11px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--faint);
                margin-top: 6px;
            }
            .hdr-r {
                display: flex;
                align-items: center;
                gap: 10px;
                position: relative;
            }
            .chip {
                border: 1px solid var(--line);
                border-radius: 30px;
                padding: 9px 16px;
                font-size: 11px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
                font-weight: 500;
                line-height: 1;
            }
            .chip b {
                color: var(--accent);
            }
            .menu-btn {
                width: 38px;
                height: 38px;
                border: 1px solid var(--line);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--muted);
            }
            .menu {
                position: absolute;
                top: 46px;
                right: 0;
                background: var(--s2);
                border: 1px solid var(--line2);
                border-radius: 14px;
                min-width: 190px;
                z-index: 60;
                overflow: hidden;
            }
            .menu button {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                padding: 15px 18px;
                font-size: 13px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-weight: 500;
            }
            .menu button:active {
                background: var(--s3);
            }
            .menu .danger {
                color: var(--danger);
            }
            .menu button:disabled {
                opacity: 0.4;
            }
            .view {
                flex: 1;
                overflow-y: auto;
                padding: 30px 22px calc(env(safe-area-inset-bottom, 0px) + 30px);
                animation: rise 0.3s ease;
            }
            .view.list-view {
                padding-bottom: 110px;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            .title {
                font-family: var(--serif);
                font-size: 44px;
                line-height: 1.02;
                margin-bottom: 10px;
                font-weight: 400;
            }
            .title em,
            .list-title em {
                font-style: italic;
                color: var(--muted);
            }
            .sub {
                color: var(--muted);
                font-size: 14px;
                line-height: 1.55;
                margin-bottom: 30px;
                max-width: 34ch;
            }
            .field {
                margin-bottom: 22px;
                position: relative;
            }
            .field label {
                display: block;
                font-size: 11px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 10px;
                font-weight: 500;
            }
            .text-in {
                width: 100%;
                background: var(--s1);
                border: 1px solid var(--line);
                border-radius: var(--r);
                padding: 18px;
                font-size: 20px;
                color: var(--text);
                outline: none;
                font-family: var(--serif);
            }
            .text-in:focus {
                border-color: var(--line2);
                background: var(--s2);
            }
            .text-in::placeholder {
                color: var(--faint);
                font-style: italic;
            }
            .hint {
                font-size: 12px;
                color: var(--danger);
                margin-top: 8px;
                min-height: 16px;
            }
            .otp-row {
                display: flex;
                gap: 12px;
            }
            .otp-box {
                flex: 1;
                height: 64px;
                background: var(--s1);
                border: 1px solid var(--line);
                border-bottom: 3px solid var(--line);
                border-radius: var(--r);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--serif);
                font-size: 30px;
            }
            .otp-box.filled,
            .otp-box.focused {
                border-bottom-color: var(--accent);
            }
            .otp-box.focused {
                background: var(--s2);
            }
            .otp-box.error {
                border-bottom-color: var(--danger);
            }
            .otp-hidden {
                position: absolute;
                opacity: 0;
                pointer-events: none;
                height: 0;
                width: 0;
            }
            .btn-primary,
            .btn-danger,
            .btn-ghost {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 9px;
                border-radius: var(--r);
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                transition: transform 0.12s;
            }
            .btn-primary {
                background: var(--accent);
                color: #111;
                padding: 19px;
                font-size: 15px;
            }
            .btn-primary:disabled {
                opacity: 0.35;
            }
            .btn-danger {
                background: var(--danger);
                color: #fff;
                padding: 17px;
                font-size: 14px;
            }
            .btn-ghost {
                border: 1px solid var(--line);
                color: var(--muted);
                padding: 16px;
                font-size: 13px;
                font-weight: 500;
                margin-top: 12px;
            }
            .btn-primary:active,
            .btn-danger:active {
                transform: scale(0.98);
            }
            .badge {
                display: inline-block;
                margin-left: 8px;
                padding: 2px 8px;
                border-radius: 20px;
                font-size: 10px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                border: 1px solid var(--line2);
                color: var(--faint);
            }
            .badge.ok {
                color: #7fd6a0;
                border-color: rgba(127, 214, 160, 0.35);
            }
            .badge.wait {
                color: #e8c36a;
                border-color: rgba(232, 195, 106, 0.35);
            }
            /* camera */
            .cam-view {
                padding: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .cam-top {
                padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
            }
            .cam-back {
                color: var(--muted);
                font-size: 13px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                font-weight: 500;
                padding: 8px 0;
            }
            .cam-step {
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--faint);
                font-weight: 500;
            }
            .cam-label {
                padding: 6px 22px 14px;
                flex-shrink: 0;
            }
            .cam-name {
                font-family: var(--serif);
                font-size: 40px;
                line-height: 1;
            }
            .cam-name em {
                font-style: italic;
                color: var(--muted);
            }
            .cam-sub {
                color: var(--muted);
                font-size: 13px;
                margin-top: 6px;
            }
            .cam-frame {
                flex: 1;
                position: relative;
                margin: 0 16px;
                border-radius: 18px;
                overflow: hidden;
                background: #000;
                border: 1px solid var(--line);
                min-height: 0;
            }
            .cam-frame video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .cam-off {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                color: var(--faint);
                font-size: 14px;
                text-align: center;
                padding: 30px;
                line-height: 1.6;
            }
            .cam-progress {
                display: flex;
                gap: 8px;
                padding: 16px 22px 4px;
                flex-shrink: 0;
            }
            .cam-dot {
                flex: 1;
                height: 3px;
                border-radius: 2px;
                background: var(--s3);
            }
            .cam-dot.done {
                background: var(--accent);
            }
            .cam-hint {
                text-align: center;
                font-size: 12px;
                color: var(--faint);
                letter-spacing: 0.08em;
                padding: 10px 22px 0;
                min-height: 26px;
                flex-shrink: 0;
            }
            .cam-controls {
                padding: 12px 22px calc(env(safe-area-inset-bottom, 0px) + 22px);
                display: flex;
                justify-content: center;
                flex-shrink: 0;
            }
            .shutter {
                width: 78px;
                height: 78px;
                border-radius: 50%;
                border: 3px solid var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    transform 0.1s,
                    opacity 0.2s;
            }
            .shutter:active {
                transform: scale(0.92);
            }
            .shutter:disabled {
                opacity: 0.35;
            }
            .shutter-inner {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: var(--accent);
            }
            .flash {
                position: absolute;
                inset: 0;
                background: #fff;
                opacity: 0;
                pointer-events: none;
                z-index: 5;
            }
            .flash.on {
                animation: flashA 0.25s ease-out;
            }
            @keyframes flashA {
                0% {
                    opacity: 0.85;
                }
                100% {
                    opacity: 0;
                }
            }
            /* list */
            .list-title {
                font-family: var(--serif);
                font-size: 34px;
                font-weight: 400;
            }
            .list-sub {
                font-size: 12px;
                color: var(--faint);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                margin: 6px 0 20px;
            }
            .worker-row {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 15px 4px;
                border-bottom: 1px solid var(--line);
            }
            .worker-idx {
                font-family: var(--serif);
                font-style: italic;
                font-size: 20px;
                color: var(--faint);
                width: 30px;
                flex-shrink: 0;
            }
            .worker-thumbs {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }
            .thumb {
                width: 52px;
                height: 52px;
                border-radius: 10px;
                overflow: hidden;
                border: 1px solid var(--line);
                background: var(--s2);
            }
            .thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .worker-info {
                flex: 1;
                min-width: 0;
            }
            .worker-name {
                font-family: var(--serif);
                font-size: 21px;
                line-height: 1.15;
            }
            .worker-meta {
                font-size: 12px;
                color: var(--muted);
                margin-top: 3px;
                letter-spacing: 0.04em;
            }
            .worker-del {
                color: var(--faint);
                padding: 10px 4px 10px 10px;
            }
            .worker-del:active {
                color: var(--danger);
            }
            .empty {
                padding: 60px 0;
                text-align: center;
                color: var(--faint);
                font-size: 13px;
            }
            .empty-serif {
                font-family: var(--serif);
                font-style: italic;
                font-size: 24px;
                color: var(--muted);
                margin-bottom: 8px;
            }
            .bottom-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 40;
                padding: 14px 22px calc(env(safe-area-inset-bottom, 0px) + 18px);
                background: var(--bg);
                border-top: 1px solid var(--line);
            }
            .bottom-inner {
                max-width: 520px;
                margin: 0 auto;
            }
            .toast {
                position: fixed;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                bottom: calc(env(safe-area-inset-bottom, 0px) + 116px);
                background: var(--s2);
                border: 1px solid var(--line2);
                padding: 13px 22px;
                border-radius: 30px;
                font-size: 13px;
                opacity: 0;
                pointer-events: none;
                z-index: 100;
                transition:
                    opacity 0.25s,
                    transform 0.25s;
                white-space: nowrap;
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%);
            }
            .sheet-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 90;
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }
            .sheet {
                width: 100%;
                max-width: 520px;
                background: var(--s1);
                border-top: 1px solid var(--line2);
                border-radius: 20px 20px 0 0;
                padding: 26px 24px calc(env(safe-area-inset-bottom, 0px) + 26px);
            }
            .sheet-title {
                font-family: var(--serif);
                font-size: 26px;
                margin-bottom: 6px;
            }
            .sheet-sub {
                color: var(--muted);
                font-size: 14px;
                margin-bottom: 22px;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="text/babel" data-presets="react">
            const { useState, useEffect, useRef, useCallback, useMemo } = React;

            /* ---------- Supabase config: paste your two values ---------- */
            const SB_URL = "https://edpgvhwfhjxdlofvfdqg.supabase.co"; // https://xxxx.supabase.co
            const SB_KEY = "sb_publishable_aDDbP8edTbDfxz2eEr5rJg_udr_22ej"; // sb_publishable_... (never the secret key)
            const SB_BUCKET = "workers";
            const CLOUD_ON =
                /^https:\/\//.test(SB_URL) && !/^PASTE/.test(SB_KEY);

            /* ---------- Icons ---------- */
            const Svg = ({ size = 15, children }) => (
                <svg
                    width={size}
                    height={size}
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="1.6"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    aria-hidden="true"
                >
                    {children}
                </svg>
            );
            const IconCamera = () => (
                <Svg>
                    <rect x="2" y="4.6" width="12" height="8.4" rx="1.8" />
                    <path d="M5.6 4.6 6.5 3.2h3l.9 1.4" />
                    <circle cx="8" cy="8.8" r="2.7" />
                </Svg>
            );
            const IconTrash = ({ size }) => (
                <Svg size={size}>
                    <path d="M2.6 4.4h10.8" />
                    <path d="M6.2 4.4V3.3A1.3 1.3 0 0 1 7.5 2h1a1.3 1.3 0 0 1 1.3 1.3v1.1" />
                    <path d="M12.4 4.4l-.5 8.3a1.3 1.3 0 0 1-1.3 1.2H5.4a1.3 1.3 0 0 1-1.3-1.2l-.5-8.3" />
                    <path d="M6.6 7v4.2M9.4 7v4.2" />
                </Svg>
            );
            const IconDownload = () => (
                <Svg>
                    <path d="M8 2.4v7.2" />
                    <path d="M5.2 6.8 8 9.6l2.8-2.8" />
                    <path d="M2.8 11.6v1.2a1.4 1.4 0 0 0 1.4 1.4h7.6a1.4 1.4 0 0 0 1.4-1.4v-1.2" />
                </Svg>
            );
            const IconSync = () => (
                <Svg>
                    <path d="M13 8a5 5 0 0 1-8.6 3.5M3 8a5 5 0 0 1 8.6-3.5" />
                    <path d="M12 2v3H9M4 14v-3h3" />
                </Svg>
            );
            const IconPlus = () => (
                <Svg>
                    <path d="M8 3.4v9.2M3.4 8h9.2" />
                </Svg>
            );
            const IconUser = () => (
                <Svg>
                    <circle cx="8" cy="5.4" r="2.6" />
                    <path d="M2.8 13.6c.6-2.6 2.6-3.8 5.2-3.8s4.6 1.2 5.2 3.8" />
                </Svg>
            );

            /* ---------- Local storage helpers (name) ---------- */
            const NAME_KEY = "scale-user-name";
            const loadName = () => {
                try {
                    return localStorage.getItem(NAME_KEY) || "";
                } catch (e) {
                    return "";
                }
            };
            const saveName = (n) => {
                try {
                    localStorage.setItem(NAME_KEY, n);
                } catch (e) {}
            };

            /* ---------- IndexedDB ---------- */
            let _db = null;
            function openDB() {
                return new Promise((res, rej) => {
                    if (_db) return res(_db);
                    const req = indexedDB.open("atelier-capture", 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains("workers"))
                            db.createObjectStore("workers", {
                                keyPath: "id",
                                autoIncrement: true,
                            });
                    };
                    req.onsuccess = (e) => {
                        _db = e.target.result;
                        res(_db);
                    };
                    req.onerror = () => rej(req.error);
                });
            }
            async function idb(mode, fn) {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const req = fn(
                        db.transaction("workers", mode).objectStore("workers"),
                    );
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }
            const idbAdd = (r) => idb("readwrite", (s) => s.add(r));
            const idbGetAll = () =>
                idb("readonly", (s) => s.getAll()).then((a) => a || []);
            const idbDelete = (id) => idb("readwrite", (s) => s.delete(id));
            const idbClear = () => idb("readwrite", (s) => s.clear());
            // Patch a record only if it still exists (so a delete mid-upload isn't undone)
            async function idbUpdate(id, patch) {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const tx = db.transaction("workers", "readwrite");
                    const st = tx.objectStore("workers");
                    const g = st.get(id);
                    g.onsuccess = () => {
                        if (g.result) st.put({ ...g.result, ...patch });
                    };
                    tx.oncomplete = () => res();
                    tx.onerror = () => rej(tx.error);
                });
            }

            /* ---------- Cloud upload (Supabase REST, no SDK) ---------- */
            const uuid = () =>
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
                          /[xy]/g,
                          (c) => {
                              const r = (Math.random() * 16) | 0;
                              return (c === "x" ? r : (r & 3) | 8).toString(16);
                          },
                      );
            const sbHeaders = (extra) =>
                Object.assign(
                    { apikey: SB_KEY },
                    SB_KEY.startsWith("eyJ")
                        ? { Authorization: "Bearer " + SB_KEY }
                        : {},
                    extra,
                );
            const isDuplicate = (status, text) =>
                status === 409 || /duplicate|already exists/i.test(text);

            async function sbUploadFile(path, blob) {
                const res = await fetch(
                    SB_URL + "/storage/v1/object/" + SB_BUCKET + "/" + path,
                    {
                        method: "POST",
                        headers: sbHeaders({ "Content-Type": "image/jpeg" }),
                        body: blob,
                    },
                );
                if (res.ok) return;
                const t = await res.text();
                if (!isDuplicate(res.status, t))
                    throw new Error("storage " + res.status + " " + t);
            }

            async function uploadWorker(w, userName) {
                const clientId = w.clientId || uuid();
                if (!w.clientId) await idbUpdate(w.id, { clientId });
                const base = w.deviceId + "/" + clientId;
                const wp = base + "/worker.jpg",
                    hp = base + "/hand.jpg";
                await Promise.all([
                    sbUploadFile(wp, w.workerPhoto),
                    sbUploadFile(hp, w.handPhoto),
                ]);
                const res = await fetch(SB_URL + "/rest/v1/workers", {
                    method: "POST",
                    headers: sbHeaders({
                        "Content-Type": "application/json",
                        Prefer: "return=minimal",
                    }),
                    body: JSON.stringify({
                        client_id: clientId,
                        device_id: w.deviceId,
                        user_name: userName || null,
                        worker_photo_path: wp,
                        hand_photo_path: hp,
                        worker_captured_at: w.workerCapturedAt,
                        hand_captured_at: w.handCapturedAt,
                    }),
                });
                if (!res.ok) {
                    const t = await res.text();
                    if (!isDuplicate(res.status, t))
                        throw new Error("table " + res.status + " " + t);
                }
                await idbUpdate(w.id, {
                    synced: true,
                    syncedAt: new Date().toISOString(),
                });
            }

            /* ---------- Fast capture ----------
   Why the old version was slow: after the first photo it called
   ImageCapture.takePhoto() (full-sensor still, 1–3s and it stalls the
   preview), then decoded + re-encoded that 12MP+ image, then ran a
   6-frame burst on full-res canvases with CPU readback. Now we only grab
   a few frames straight from the live video at ≤1600px — ~200–400 ms. */
            const MAX_DIM = 1600,
                QUALITY = 0.85,
                SCORE_W = 240,
                BURST = 3,
                GAP = 50;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            function sharpness(ctx, w, h) {
                const d = ctx.getImageData(0, 0, w, h).data;
                const g = new Float32Array(w * h);
                for (let i = 0, j = 0; i < d.length; i += 4, j++)
                    g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                let sum = 0,
                    sq = 0,
                    n = 0;
                for (let y = 1; y < h - 1; y++)
                    for (let x = 1; x < w - 1; x++) {
                        const i = y * w + x;
                        const l =
                            -4 * g[i] +
                            g[i - 1] +
                            g[i + 1] +
                            g[i - w] +
                            g[i + w];
                        sum += l;
                        sq += l * l;
                        n++;
                    }
                const m = sum / n;
                return sq / n - m * m;
            }

            async function captureFrame(video) {
                if (!video || video.readyState < 2 || !video.videoWidth)
                    return null;
                const vw = video.videoWidth,
                    vh = video.videoHeight;
                const s = Math.min(1, MAX_DIM / Math.max(vw, vh));
                const w = Math.round(vw * s),
                    h = Math.round(vh * s);
                const cur = document.createElement("canvas");
                cur.width = w;
                cur.height = h;
                const best = document.createElement("canvas");
                best.width = w;
                best.height = h;
                const small = document.createElement("canvas");
                small.width = SCORE_W;
                small.height = Math.round((SCORE_W * h) / w);
                const cctx = cur.getContext("2d"),
                    bctx = best.getContext("2d"),
                    sctx = small.getContext("2d", { willReadFrequently: true });
                let top = -1;
                for (let i = 0; i < BURST; i++) {
                    if (i) await sleep(GAP);
                    cctx.drawImage(video, 0, 0, w, h);
                    sctx.drawImage(cur, 0, 0, small.width, small.height);
                    const sc = sharpness(sctx, small.width, small.height);
                    if (sc > top) {
                        top = sc;
                        bctx.drawImage(cur, 0, 0);
                    }
                }
                return new Promise((res, rej) =>
                    best.toBlob(
                        (b) => (b ? res(b) : rej(new Error("encode failed"))),
                        "image/jpeg",
                        QUALITY,
                    ),
                );
            }

            async function tuneTrack(track) {
                try {
                    const caps = track.getCapabilities
                        ? track.getCapabilities()
                        : {};
                    const adv = [];
                    ["focusMode", "exposureMode", "whiteBalanceMode"].forEach(
                        (k) => {
                            if (caps[k] && caps[k].indexOf("continuous") !== -1)
                                adv.push({ [k]: "continuous" });
                        },
                    );
                    if (adv.length)
                        await track.applyConstraints({ advanced: adv });
                } catch (e) {}
            }

            /* ---------- Small components ---------- */
            const Toast = ({ msg }) => (
                <div className={"toast" + (msg ? " show" : "")}>{msg}</div>
            );

            function Thumb({ blob }) {
                const url = useMemo(
                    () => (blob ? URL.createObjectURL(blob) : null),
                    [blob],
                );

                    () => () => {
                        if (url) URL.revokeObjectURL(url);
                    },
                    [url],
                );
                return (
                    <div className="thumb">

            }

            function OtpInput({ value, onChange, error }) {
                const [focused, setFocused] = useState(false);
                const ref = useRef(null);
                return (
                    <div className="field">
                        <label>Device ID</label>
                        <div
                            className="otp-row"
                            onClick={() => ref.current && ref.current.focus()}

                            {[0, 1, 2, 3, 4].map((i) => (
                                <div
                                    key={i}
                                    className={
                                        "otp-box" +
                                        (value[i] ? " filled" : "") +
                                        (focused &&
                                        (i === value.length ||
                                            (value.length === 5 && i === 4))
                                            ? " focused"

                                    }

                                    {value[i] || ""}
                                </div>
                            ))}
                        </div>
                        <input
                            ref={ref}
                            className="otp-hidden"
                            type="text"
                            autoFocus
                            inputMode="numeric"

                            value={value}

                                onChange(
                                    e.target.value
                                        .replace(/\D/g, "")

            /* ---------- Views ---------- */
            function NameView({ initial, onSave, onSkip }) {
                const [name, setName] = useState(initial || "");
                const submit = (e) => {
                    e.preventDefault();
                    if (name.trim()) onSave(name.trim());
                };
                return (
                    <div className="view">
                        <h1 className="title">
                            Welcome, <em>who's this?</em>
                        </h1>
                        <p className="sub">
                            Enter your name once. It's saved on this device and
                            added to exports.
                        </p>
                        <form onSubmit={submit} autoComplete="off">
                            <div className="field">
                                <label>Your name</label>
                                <input
                                    className="text-in"
                                    autoFocus
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="e.g. Ravi Kumar"

                            <button
                                type="submit"

                                disabled={!name.trim()}

                            </button>

                                    Cancel

                    </div>

            }

            function WorkerForm({ onSubmit }) {
                const [device, setDevice] = useState("");
                const [err, setErr] = useState("");
                const submit = (e) => {
                    e.preventDefault();
                    if (!/^\d{5}$/.test(device))
                        return setErr("Device ID must be exactly 5 digits");
                    setErr("");
                    onSubmit(device);
                };
                return (
                    <div className="view">
                        <h1 className="title">
                            Worker <em>capture</em>
                        </h1>
                        <p className="sub">
                            Enter the 5-digit device ID, then take two photos.
                        </p>
                        <form onSubmit={submit} autoComplete="off">
                            <OtpInput
                                value={device}
                                onChange={setDevice}
                                error={!!err}
                            />
                            <div className="hint">{err}</div>
                            <button type="submit" className="btn-primary">
                                <IconCamera />
                                Open Camera
                            </button>
                        </form>
                    </div>
                );
            }

            function CameraView({ deviceId, onComplete, onCancel, showToast }) {
                const [step, setStep] = useState("worker");
                const [camError, setCamError] = useState(null);
                const [flash, setFlash] = useState(false);
                const [ready, setReady] = useState(false);
                const [capturing, setCapturing] = useState(false);
                const videoRef = useRef(null),
                    streamRef = useRef(null),
                    busy = useRef(false);
                const shots = useRef({
                    worker: null,
                    hand: null,
                    workerAt: null,
                    handAt: null,
                });

                useEffect(() => {
                    let cancelled = false;
                    (async () => {
                        if (
                            !navigator.mediaDevices ||
                            !navigator.mediaDevices.getUserMedia
                        )
                            return setCamError(
                                "Camera not supported. Use a modern mobile browser over HTTPS or localhost.",
                            );
                        try {
                            const stream =
                                await navigator.mediaDevices.getUserMedia({
                                    audio: false,
                                    video: {
                                        facingMode: { ideal: "environment" },
                                        width: { ideal: 1920 },
                                        height: { ideal: 1080 },
                                    },
                                });
                            if (cancelled)
                                return stream
                                    .getTracks()
                                    .forEach((t) => t.stop());
                            streamRef.current = stream;
                            tuneTrack(stream.getVideoTracks()[0]);
                            const v = videoRef.current;
                            if (v) {
                                v.srcObject = stream;
                                try {
                                    await v.play();
                                } catch (e) {}
                            }
                        } catch (err) {
                            if (cancelled) return;
                            setCamError(
                                err.name === "NotAllowedError" ||
                                    err.name === "SecurityError"
                                    ? "Camera permission denied. Allow camera access in browser settings, then try again."
                                    : err.name === "NotFoundError"
                                      ? "No camera found on this device."
                                      : "Could not start camera: " +
                                        err.message,
                            );
                        }
                    })();
                    return () => {
                        cancelled = true;
                        if (streamRef.current)
                            streamRef.current
                                .getTracks()
                                .forEach((t) => t.stop());
                    };
                }, []);

                const tapFocus = async (e) => {
                    const track =
                        streamRef.current &&
                        streamRef.current.getVideoTracks()[0];
                    try {
                        if (!track || !track.getCapabilities().pointsOfInterest)
                            return;
                        const r = e.currentTarget.getBoundingClientRect();
                        const x = Math.min(
                            1,
                            Math.max(0, (e.clientX - r.left) / r.width),
                        );
                        const y = Math.min(
                            1,
                            Math.max(0, (e.clientY - r.top) / r.height),
                        );
                        await track.applyConstraints({
                            advanced: [
                                {
                                    pointsOfInterest: [{ x, y }],
                                    focusMode: "single-shot",
                                },
                            ],
                        });
                        setTimeout(
                            () =>
                                track
                                    .applyConstraints({
                                        advanced: [{ focusMode: "continuous" }],
                                    })
                                    .catch(() => {}),
                            1800,
                        );
                    } catch (err) {}
                };

                const capture = async () => {
                    if (busy.current || camError || !ready) return;
                    busy.current = true;
                    setCapturing(true);
                    const capturedAt = new Date().toISOString(); // moment the shutter was pressed
                    try {
                        setFlash(true);
                        setTimeout(() => setFlash(false), 260);
                        const blob = await captureFrame(videoRef.current);
                        if (!blob) throw new Error("no frame");
                        shots.current[step] = blob;
                        shots.current[step + "At"] = capturedAt;
                        if (step === "worker") {
                            setStep("hand");
                            showToast("Worker photo saved — now the hand");
                        } else {
                            setStep("saving");
                            await onComplete(shots.current);
                        }
                    } catch (e) {
                        showToast("Capture failed — please retry");
                    } finally {
                        busy.current = false;
                        setCapturing(false);
                    }
                };

                const hint = camError
                    ? ""
                    : capturing
                      ? "Hold still…"
                      : !ready
                        ? "Starting camera…"
                        : "Tap the preview to focus";

                return (
                    <div className="view cam-view">
                        <div className="cam-top">
                            <button className="cam-back" onClick={onCancel}>
                                ‹ Cancel
                            </button>
                            <div className="cam-step">
                                {step === "worker"
                                    ? "Step 1 of 2"
                                    : "Step 2 of 2"}
                            </div>
                        </div>
                        <div className="cam-label">
                            <div className="cam-name">
                                {step === "worker" ? (
                                    <>
                                        Worker <em>photo</em>
                                    </>
                                ) : (
                                    <>
                                        Hand <em>photo</em>
                                    </>
                                )}
                            </div>
                            <div className="cam-sub">ID {deviceId}</div>
                        </div>
                        <div className="cam-frame" onClick={tapFocus}>
                            {camError ? (
                                <div className="cam-off">{camError}</div>
                            ) : (
                                <video
                                    ref={videoRef}
                                    playsInline
                                    muted
                                    autoPlay
                                    onCanPlay={() => setReady(true)}
                                />
                            )}
                            <div
                                className={"flash" + (flash ? " on" : "")}
                            ></div>
                        </div>
                        <div className="cam-progress">
                            <div
                                className={
                                    "cam-dot" +
                                    (shots.current.worker ? " done" : "")
                                }
                            ></div>
                            <div
                                className={
                                    "cam-dot" +
                                    (shots.current.hand ? " done" : "")
                                }
                            ></div>
                        </div>
                        <div className="cam-hint">{hint}</div>
                        <div className="cam-controls">
                            <button
                                className="shutter"
                                onClick={capture}
                                disabled={
                                    !!camError ||
                                    !ready ||
                                    capturing ||
                                    step === "saving"
                                }
                                aria-label="Capture photo"
                            >
                                <div className="shutter-inner"></div>
                            </button>
                        </div>
                    </div>
                );
            }

            const fmt = (iso) =>
                iso
                    ? new Date(iso).toLocaleString([], {
                          day: "numeric",
                          month: "short",
                          hour: "2-digit",
                          minute: "2-digit",
                      })
                    : "";

            function WorkerList({ workers, onDelete, cloudOn }) {
                const pending = workers.filter((w) => !w.synced).length;
                return (
                    <div className="view list-view">
                        <h2 className="list-title">
                            Captured <em>workers</em>
                        </h2>
                        <div className="list-sub">
                            {workers.length} total
                            {cloudOn && pending
                                ? " · " + pending + " waiting to upload"
                                : ""}
                        </div>
                        {workers.length === 0 ? (
                            <div className="empty">
                                <div className="empty-serif">
                                    Nothing captured yet.
                                </div>
                                Add your first worker to begin.
                            </div>
                        ) : (
                            workers.map((w, i) => (
                                <div className="worker-row" key={w.id}>
                                    <div className="worker-idx">
                                        {String(i + 1).padStart(2, "0")}
                                    </div>
                                    <div className="worker-thumbs">
                                        <Thumb blob={w.workerPhoto} />
                                        <Thumb blob={w.handPhoto} />
                                    </div>
                                    <div className="worker-info">
                                        <div className="worker-name">
                                            ID {w.deviceId}
                                        </div>
                                        <div className="worker-meta">
                                            {fmt(w.workerCapturedAt)}
                                            {cloudOn &&
                                                (w.synced ? (
                                                    <span className="badge ok">
                                                        Synced
                                                    </span>
                                                ) : (
                                                    <span className="badge wait">
                                                        Pending
                                                    </span>
                                                ))}
                                        </div>
                                    </div>
                                    <button
                                        className="worker-del"
                                        onClick={() => onDelete(w)}
                                        aria-label="Delete"
                                    >
                                        <IconTrash size={16} />
                                    </button>
                                </div>
                            ))
                        )}
                    </div>
                );
            }

            /* ---------- App ---------- */
            function App() {
                const [userName, setUserName] = useState(loadName());
                const [screen, setScreen] = useState(
                    userName ? "list" : "name",
                );
                const [workers, setWorkers] = useState([]);
                const [pendingId, setPendingId] = useState(null);
                const [toast, setToast] = useState("");
                const [exporting, setExporting] = useState(false);
                const [deleteTarget, setDeleteTarget] = useState(null);
                const [confirmAll, setConfirmAll] = useState(false);
                const [menuOpen, setMenuOpen] = useState(false);
                const timer = useRef(null);

                const showToast = useCallback((m) => {
                    setToast(m);
                    clearTimeout(timer.current);
                    timer.current = setTimeout(() => setToast(""), 2200);
                }, []);
                const refresh = useCallback(async () => {
                    const all = await idbGetAll();
                    setWorkers(all.sort((a, b) => a.id - b.id));
                }, []);
                const nameRef = useRef(userName);
                nameRef.current = userName;
                const syncing = useRef(false);
                const syncAll = useCallback(async (manual) => {
                    if (!CLOUD_ON) {
                        if (manual === true)
                            showToast("Add your Supabase URL and key first");
                        return;
                    }
                    if (syncing.current) return;
                    if (!navigator.onLine) {
                        if (manual === true)
                            showToast("You're offline — will upload later");
                        return;
                    }
                    syncing.current = true;
                    let ok = 0,
                        fail = 0;
                    try {
                        const all = await idbGetAll();
                        for (const w of all.filter(
                            (x) => x.workerPhoto && x.handPhoto && !x.synced,
                        )) {
                            try {
                                await uploadWorker(w, nameRef.current);
                                ok++;
                            } catch (e) {
                                console.error("Upload failed", e);
                                fail++;
                            }
                        }
                        await refresh();
                    } catch (e) {
                        console.error(e);
                    }
                    syncing.current = false;
                    if (fail)
                        showToast(
                            "Upload failed for " + fail + " — will retry",
                        );
                    else if (ok)
                        showToast(
                            "Uploaded " + ok + " worker" + (ok > 1 ? "s" : ""),
                        );
                    else if (manual === true)
                        showToast("Everything is already uploaded");
                }, []);

                useEffect(() => {
                    refresh().then(
                        () => syncAll(),
                        () => showToast("Could not load saved workers"),
                    );
                    const on = () => syncAll();
                    window.addEventListener("online", on);
                    const t = setInterval(on, 60000); // retry failed uploads every minute
                    return () => {
                        window.removeEventListener("online", on);
                        clearInterval(t);
                    };
                }, []);

                const handleComplete = async (s) => {
                    await idbAdd({
                        deviceId: pendingId,
                        clientId: uuid(),
                        synced: false,
                        workerPhoto: s.worker,
                        handPhoto: s.hand,
                        workerCapturedAt: s.workerAt,
                        handCapturedAt: s.handAt,
                    });
                    await refresh();
                    setPendingId(null);
                    setScreen("form");
                    showToast("Worker saved");
                    syncAll();
                };

                const confirmDelete = async () => {
                    try {
                        await idbDelete(deleteTarget.id);
                        await refresh();
                        showToast("Worker deleted");
                    } catch {
                        showToast("Delete failed");
                    }
                    setDeleteTarget(null);
                };
                const deleteAll = async () => {
                    try {
                        await idbClear();
                        await refresh();
                        showToast("All workers deleted");
                    } catch {
                        showToast("Delete failed");
                    }
                    setConfirmAll(false);
                };

                const handleExport = async () => {
                    if (exporting) return;
                    const complete = workers.filter(
                        (w) => w.workerPhoto && w.handPhoto,
                    );
                    if (!complete.length)
                        return showToast("No complete workers to export");
                    setExporting(true);
                    try {
                        const zip = new JSZip();
                        const list = complete.map((w, i) => {
                            const n = String(i + 1);
                            const f = zip.folder(n);
                            f.file("worker.jpg", w.workerPhoto);
                            f.file("hand.jpg", w.handPhoto);
                            return {
                                deviceID: w.deviceId,
                                workerPhoto: n + "/worker.jpg",
                                workerCapturedAt: w.workerCapturedAt,
                                hand: n + "/hand.jpg",
                                handCapturedAt: w.handCapturedAt,
                            };
                        });
                        zip.file(
                            "workers.json",
                            JSON.stringify(
                                { name: userName, workers: list },
                                null,
                                2,
                            ),
                        );
                        const blob = await zip.generateAsync({
                            type: "blob",
                            compression: "DEFLATE",
                            compressionOptions: { level: 6 },
                        });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download =
                            "workers-" +
                            new Date().toISOString().slice(0, 10) +
                            ".zip";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 5000);
                        showToast(
                            "ZIP downloaded — " + complete.length + " workers",
                        );
                    } catch (e) {
                        showToast("Export failed: " + e.message);
                    }
                    setExporting(false);
                };

                const hasName = !!userName;

                return (
                    <div className="app">
                        <div className="header">
                            <div className="brand">
                                Scale{hasName && <small>{userName}</small>}
                            </div>
                            {hasName && (
                                <div className="hdr-r">
                                    <button
                                        className="chip"
                                        onClick={() => setScreen("list")}
                                    >
                                        <b>{workers.length}</b> captured
                                    </button>
                                    {screen === "list" && (
                                        <>
                                            <button
                                                className="menu-btn"
                                                onClick={() =>
                                                    setMenuOpen((o) => !o)
                                                }
                                                aria-label="Options"
                                            >
                                                <svg
                                                    width="16"
                                                    height="16"
                                                    viewBox="0 0 16 16"
                                                    fill="currentColor"
                                                >
                                                    <circle
                                                        cx="2.5"
                                                        cy="8"
                                                        r="1.6"
                                                    />
                                                    <circle
                                                        cx="8"
                                                        cy="8"
                                                        r="1.6"
                                                    />
                                                    <circle
                                                        cx="13.5"
                                                        cy="8"
                                                        r="1.6"
                                                    />
                                                </svg>
                                            </button>
                                            {menuOpen && (
                                                <div className="menu">
                                                    <button
                                                        onClick={() => {
                                                            setMenuOpen(false);
                                                            handleExport();
                                                        }}
                                                        disabled={
                                                            exporting ||
                                                            !workers.length
                                                        }
                                                    >
                                                        {exporting ? (
                                                            "Building ZIP…"
                                                        ) : (
                                                            <>
                                                                <IconDownload />
                                                                Export ZIP
                                                            </>
                                                        )}
                                                    </button>
                                                    {CLOUD_ON && (
                                                        <button
                                                            onClick={() => {
                                                                setMenuOpen(
                                                                    false,
                                                                );
                                                                syncAll(true);
                                                            }}
                                                        >
                                                            <IconSync />
                                                            Sync now
                                                        </button>
                                                    )}
                                                    <button
                                                        onClick={() => {
                                                            setMenuOpen(false);
                                                            setScreen("name");
                                                        }}
                                                    >
                                                        <IconUser />
                                                        Change name
                                                    </button>
                                                    <button
                                                        className="danger"
                                                        onClick={() => {
                                                            setMenuOpen(false);
                                                            setConfirmAll(true);
                                                        }}
                                                        disabled={
                                                            !workers.length
                                                        }
                                                    >
                                                        <IconTrash />
                                                        Delete all
                                                    </button>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                        </div>

                        {screen === "name" && (
                            <NameView
                                initial={userName}
                                onSave={(n) => {
                                    saveName(n);
                                    setUserName(n);
                                    setScreen("list");
                                }}
                                onSkip={
                                    hasName ? () => setScreen("list") : null
                                }
                            />
                        )}
                        {screen === "list" && (
                            <WorkerList
                                workers={workers}
                                onDelete={setDeleteTarget}
                                cloudOn={CLOUD_ON}
                            />
                        )}
                        {screen === "form" && (
                            <WorkerForm
                                onSubmit={(id) => {
                                    setPendingId(id);
                                    setScreen("camera");
                                }}
                            />
                        )}
                        {screen === "camera" && pendingId && (
                            <CameraView
                                deviceId={pendingId}
                                onComplete={handleComplete}
                                onCancel={() => {
                                    setPendingId(null);
                                    setScreen("list");
                                }}
                                showToast={showToast}
                            />
                        )}

                        {screen === "list" && (
                            <div className="bottom-bar">
                                <div className="bottom-inner">
                                    <button
                                        className="btn-primary"
                                        onClick={() => setScreen("form")}
                                        style={{ marginTop: 0 }}
                                    >
                                        <IconPlus />
                                        New Worker
                                    </button>
                                </div>
                            </div>
                        )}

                        {menuOpen && (
                            <div
                                style={{
                                    position: "fixed",
                                    inset: 0,
                                    zIndex: 50,
                                }}
                                onClick={() => setMenuOpen(false)}
                            ></div>
                        )}

                        {confirmAll && (
                            <div
                                className="sheet-backdrop"
                                onClick={() => setConfirmAll(false)}
                            >
                                <div
                                    className="sheet"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="sheet-title">
                                        Delete all workers?
                                    </div>
                                    <div className="sheet-sub">
                                        This permanently removes all{" "}
                                        {workers.length} workers and their
                                        photos from this device.
                                    </div>
                                    <button
                                        className="btn-danger"
                                        onClick={deleteAll}
                                    >
                                        <IconTrash />
                                        Delete everything
                                    </button>
                                    <button
                                        className="btn-ghost"
                                        onClick={() => setConfirmAll(false)}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}
                        {deleteTarget && (
                            <div
                                className="sheet-backdrop"
                                onClick={() => setDeleteTarget(null)}
                            >
                                <div
                                    className="sheet"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="sheet-title">
                                        Delete worker {deleteTarget.deviceId}?
                                    </div>
                                    <div className="sheet-sub">
                                        Both photos and the record will be
                                        removed from this device.
                                    </div>
                                    <button
                                        className="btn-danger"
                                        onClick={confirmDelete}
                                    >
                                        <IconTrash />
                                        Delete permanently
                                    </button>
                                    <button
                                        className="btn-ghost"
                                        onClick={() => setDeleteTarget(null)}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}
                        <Toast msg={toast} />
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(
                <App />,
            );
        </script>
    </body>
</html>
