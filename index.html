<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0b0b0c" />
        <title>Scale — Worker Capture</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />

        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.production.min.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
        ></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

        <style>
            :root {
                --bg: #0b0b0c;
                --surface: #131315;
                --surface-2: #1a1a1d;
                --surface-3: #222226;
                --line: rgba(255, 255, 255, 0.08);
                --line-strong: rgba(255, 255, 255, 0.14);
                --text: #f2f0ea;
                --muted: #8b8b90;
                --faint: #55555a;
                --accent: #e8e4da;
                --danger: #e5484d;
                --radius: 14px;
                --serif: "Instrument Serif", Georgia, serif;
                --sans: "Space Grotesk", -apple-system, sans-serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                height: 100%;
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
                overscroll-behavior: none;
            }
            #root {
                height: 100%;
            }
            button {
                font-family: inherit;
                cursor: pointer;
                border: none;
                background: none;
                color: inherit;
            }
            input {
                font-family: inherit;
            }

            .app {
                height: 100%;
                display: flex;
                flex-direction: column;
                max-width: 520px;
                margin: 0 auto;
                position: relative;
                background: var(--bg);
            }
            @media (min-width: 560px) {
                .app {
                    border-left: 1px solid var(--line);
                    border-right: 1px solid var(--line);
                }
            }

            .header {
                padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px 18px;
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                flex-shrink: 0;
            }
            .brand {
                font-family: var(--serif);
                font-size: 30px;
                line-height: 1;
                letter-spacing: 0.01em;
            }
            .brand em {
                font-style: italic;
                color: var(--muted);
            }
            .chip {
                border: 1px solid var(--line);
                border-radius: 30px;
                padding: 9px 16px;
                font-size: 11px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
                font-weight: 500;
                transition:
                    border-color 0.2s,
                    color 0.2s,
                    background 0.2s;
                line-height: 1;
            }
            .chip:active {
                border-color: var(--line-strong);
                color: var(--text);
                background: var(--surface-2);
            }
            .chip b {
                color: var(--accent);
                font-weight: 600;
            }
            .chip.active-chip {
                background: var(--accent);
                color: #111;
                border-color: var(--accent);
            }
            .chip.active-chip b {
                color: #111;
            }

            .view {
                flex: 1;
                overflow-y: auto;
                padding: 26px 22px calc(env(safe-area-inset-bottom, 0px) + 30px);
                animation: rise 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .view.list-view {
                padding-bottom: 110px;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--faint);
                margin-bottom: 10px;
                font-weight: 500;
            }
            .title {
                font-family: var(--serif);
                font-size: 44px;
                line-height: 1.02;
                margin-bottom: 8px;
                font-weight: 400;
            }
            .title em {
                font-style: italic;
                color: var(--muted);
            }
            .sub {
                color: var(--muted);
                font-size: 14px;
                line-height: 1.55;
                margin-bottom: 34px;
                max-width: 34ch;
            }

            .otp-row {
                display: flex;
                gap: 12px;
                margin-bottom: 6px;
            }
            .otp-box {
                flex: 1;
                height: 64px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--serif);
                font-size: 30px;
                color: var(--text);
                border-bottom: 3px solid var(--line);
                transition:
                    border-color 0.15s,
                    background 0.15s;
                caret-color: var(--accent);
            }
            .otp-box.filled {
                border-bottom-color: var(--accent);
            }
            .otp-box.focused {
                border-bottom-color: var(--accent);
                background: var(--surface-2);
            }
            .otp-box.error {
                border-bottom-color: var(--danger);
            }
            .otp-hidden {
                position: absolute;
                opacity: 0;
                pointer-events: none;
                height: 0;
                width: 0;
            }

            .field {
                margin-bottom: 22px;
            }
            .field label {
                display: block;
                font-size: 11px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 10px;
                font-weight: 500;
            }
            .field input {
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                padding: 18px 18px;
                font-size: 19px;
                color: var(--text);
                outline: none;
                transition:
                    border-color 0.2s,
                    background 0.2s;
                font-family: var(--serif);
            }
            .field input::placeholder {
                color: var(--faint);
                font-style: italic;
            }
            .field input:focus {
                border-color: var(--line-strong);
                background: var(--surface-2);
            }
            .field input.input-error {
                border-color: rgba(229, 72, 77, 0.6);
            }
            .field-hint {
                font-size: 12px;
                color: var(--danger);
                margin-top: 8px;
                min-height: 16px;
            }

            .btn-primary {
                width: 100%;
                background: var(--accent);
                color: #111;
                border-radius: var(--radius);
                padding: 19px;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                transition:
                    transform 0.12s ease,
                    opacity 0.2s;
                margin-top: 8px;
            }
            .btn-primary:active {
                transform: scale(0.98);
            }
            .btn-primary:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }

            .btn-ghost {
                width: 100%;
                border: 1px solid var(--line);
                color: var(--muted);
                border-radius: var(--radius);
                padding: 16px;
                font-size: 13px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                font-weight: 500;
                margin-top: 12px;
                transition:
                    border-color 0.2s,
                    color 0.2s;
            }
            .btn-ghost:active {
                border-color: var(--line-strong);
                color: var(--text);
            }

            /* ---------- Camera ---------- */
            .cam-view {
                padding: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .cam-top {
                padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
            }
            .cam-back {
                color: var(--muted);
                font-size: 13px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                padding: 8px 0;
                font-weight: 500;
            }
            .cam-step {
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--faint);
                font-weight: 500;
            }

            .cam-stage-label {
                padding: 6px 22px 14px;
                flex-shrink: 0;
            }
            .cam-stage-name {
                font-family: var(--serif);
                font-size: 40px;
                line-height: 1;
            }
            .cam-stage-name em {
                font-style: italic;
                color: var(--muted);
            }
            .cam-stage-sub {
                color: var(--muted);
                font-size: 13px;
                margin-top: 6px;
            }

            .cam-frame {
                flex: 1;
                position: relative;
                margin: 0 16px;
                border-radius: 18px;
                overflow: hidden;
                background: #000;
                border: 1px solid var(--line);
                min-height: 0;
            }
            .cam-frame video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .cam-frame .cam-off {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                color: var(--faint);
                font-size: 14px;
                text-align: center;
                padding: 30px;
                line-height: 1.6;
            }

            .cam-progress {
                display: flex;
                gap: 8px;
                padding: 16px 22px 4px;
                flex-shrink: 0;
            }
            .cam-dot {
                flex: 1;
                height: 3px;
                border-radius: 2px;
                background: var(--surface-3);
                overflow: hidden;
                position: relative;
            }
            .cam-dot.done::after {
                content: "";
                position: absolute;
                inset: 0;
                background: var(--accent);
            }

            .cam-controls {
                padding: 16px 22px calc(env(safe-area-inset-bottom, 0px) + 22px);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .shutter {
                width: 78px;
                height: 78px;
                border-radius: 50%;
                border: 3px solid var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    transform 0.1s,
                    opacity 0.2s;
            }
            .shutter:active {
                transform: scale(0.92);
            }
            .shutter:disabled {
                opacity: 0.35;
            }
            .shutter-inner {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: var(--accent);
            }

            .flash {
                position: absolute;
                inset: 0;
                background: #fff;
                opacity: 0;
                pointer-events: none;
                z-index: 5;
            }
            .flash.on {
                animation: flashA 0.3s ease-out;
            }
            @keyframes flashA {
                0% {
                    opacity: 0.85;
                }
                100% {
                    opacity: 0;
                }
            }

            .cam-hint {
                text-align: center;
                font-size: 12px;
                color: var(--faint);
                letter-spacing: 0.08em;
                padding: 10px 22px 0;
                flex-shrink: 0;
                min-height: 16px;
            }

            /* ---------- Worker list ---------- */
            .list-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                margin-bottom: 6px;
            }
            .list-title {
                font-family: var(--serif);
                font-size: 34px;
            }
            .list-title em {
                font-style: italic;
                color: var(--muted);
            }
            .list-sub {
                font-size: 12px;
                color: var(--faint);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                margin-bottom: 20px;
            }

            .worker-row {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 15px 4px;
                border-bottom: 1px solid var(--line);
                animation: rise 0.3s ease;
            }
            .worker-idx {
                font-family: var(--serif);
                font-style: italic;
                font-size: 20px;
                color: var(--faint);
                width: 34px;
                flex-shrink: 0;
            }
            .worker-info {
                flex: 1;
                min-width: 0;
            }
            .worker-name {
                font-family: var(--serif);
                font-size: 21px;
                line-height: 1.15;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .worker-meta {
                font-size: 12px;
                color: var(--muted);
                margin-top: 3px;
                letter-spacing: 0.06em;
            }
            .worker-del {
                flex-shrink: 0;
                color: var(--faint);
                font-size: 12px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 10px 4px 10px 12px;
                font-weight: 500;
                transition: color 0.2s;
            }
            .worker-del:active {
                color: var(--danger);
            }

            .empty {
                padding: 60px 0;
                text-align: center;
                color: var(--faint);
            }
            .empty-serif {
                font-family: var(--serif);
                font-style: italic;
                font-size: 24px;
                color: var(--muted);
                margin-bottom: 8px;
            }

            .bottom-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 40;
                padding: 14px 22px calc(env(safe-area-inset-bottom, 0px) + 18px);
                background: var(--bg);
                border-top: 1px solid var(--line);
            }
            .bottom-bar-inner {
                max-width: 520px;
                margin: 0 auto;
            }
            .btn-new {
                width: 100%;
                background: var(--accent);
                color: #111;
                border-radius: var(--radius);
                padding: 19px;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                transition: transform 0.12s ease;
            }
            .btn-new:active {
                transform: scale(0.98);
            }

            .hdr-actions {
                position: relative;
            }
            .menu-btn {
                width: 38px;
                height: 38px;
                border: 1px solid var(--line);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--muted);
                padding: 0;
                line-height: 1;
                transition:
                    border-color 0.2s,
                    color 0.2s;
            }
            .menu-btn svg {
                display: block;
            }
            .menu-btn:active {
                border-color: var(--line-strong);
                color: var(--text);
            }
            .menu {
                position: absolute;
                top: 46px;
                right: 0;
                background: var(--surface-2);
                border: 1px solid var(--line-strong);
                border-radius: 14px;
                min-width: 190px;
                z-index: 60;
                overflow: hidden;
                animation: menuIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
                transform-origin: top right;
            }
            @keyframes menuIn {
                from {
                    opacity: 0;
                    transform: scale(0.92);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            .menu button {
                display: block;
                width: 100%;
                text-align: left;
                padding: 15px 18px;
                font-size: 13px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-weight: 500;
                color: var(--text);
                transition: background 0.15s;
            }
            .menu button:active {
                background: var(--surface-3);
            }
            .menu button.danger {
                color: var(--danger);
            }
            .menu button:disabled {
                opacity: 0.4;
            }

            .toast {
                position: fixed;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                bottom: calc(env(safe-area-inset-bottom, 0px) + 116px);
                background: var(--surface-2);
                border: 1px solid var(--line-strong);
                color: var(--text);
                padding: 13px 22px;
                border-radius: 30px;
                font-size: 13px;
                letter-spacing: 0.04em;
                opacity: 0;
                pointer-events: none;
                z-index: 100;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                transition:
                    opacity 0.25s,
                    transform 0.25s;
                white-space: nowrap;
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            .worker-thumbs {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }
            .thumb {
                width: 52px;
                height: 52px;
                border-radius: 10px;
                overflow: hidden;
                border: 1px solid var(--line);
                background: var(--surface-2);
                position: relative;
                flex-shrink: 0;
            }
            .thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .thumb-missing {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                color: var(--faint);
                font-family: var(--serif);
                font-style: italic;
                font-size: 16px;
            }
            .thumb-tag {
                position: absolute;
                left: 0;
                bottom: 0;
                right: 0;
                font-size: 8px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                text-align: center;
                padding: 2px 0 3px;
                background: rgba(0, 0, 0, 0.55);
                color: rgba(255, 255, 255, 0.75);
                font-weight: 500;
            }

            .sheet-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 90;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                animation: fadeIn 0.2s;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            .sheet {
                width: 100%;
                max-width: 520px;
                background: var(--surface);
                border-top: 1px solid var(--line-strong);
                border-radius: 20px 20px 0 0;
                padding: 26px 24px calc(env(safe-area-inset-bottom, 0px) + 26px);
                animation: sheetUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            }
            @keyframes sheetUp {
                from {
                    transform: translateY(100%);
                }
                to {
                    transform: none;
                }
            }
            .sheet-title {
                font-family: var(--serif);
                font-size: 26px;
                margin-bottom: 6px;
            }
            .sheet-sub {
                color: var(--muted);
                font-size: 14px;
                margin-bottom: 22px;
            }
            .btn-danger {
                width: 100%;
                background: var(--danger);
                color: #fff;
                border-radius: var(--radius);
                padding: 17px;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }
            .btn-danger:active {
                transform: scale(0.98);
            }
        </style>
        <base target="_blank" />
    </head>
    <body>
        <div id="root"></div>

        <script type="text/babel" data-presets="react">
            const { useState, useEffect, useRef, useCallback } = React;

            /* ============================================================
   IndexedDB layer
============================================================ */
            const DB_NAME = "atelier-capture";
            const DB_VER = 1;
            let _db = null;

            function openDB() {
                return new Promise((res, rej) => {
                    if (_db) return res(_db);
                    const req = indexedDB.open(DB_NAME, DB_VER);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains("workers")) {
                            db.createObjectStore("workers", {
                                keyPath: "id",
                                autoIncrement: true,
                            });
                        }
                    };
                    req.onsuccess = (e) => {
                        _db = e.target.result;
                        res(_db);
                    };
                    req.onerror = () => rej(req.error);
                });
            }

            async function idbAdd(record) {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const tx = db.transaction("workers", "readwrite");
                    const req = tx.objectStore("workers").add(record);
                    req.onsuccess = () => res(req.result);
                    req.onerror = () => rej(req.error);
                });
            }
            async function idbGetAll() {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const req = db
                        .transaction("workers", "readonly")
                        .objectStore("workers")
                        .getAll();
                    req.onsuccess = () => res(req.result || []);
                    req.onerror = () => rej(req.error);
                });
            }
            async function idbDelete(id) {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const req = db
                        .transaction("workers", "readwrite")
                        .objectStore("workers")
                        .delete(id);
                    req.onsuccess = () => res();
                    req.onerror = () => rej(req.error);
                });
            }
            async function idbClear() {
                const db = await openDB();
                return new Promise((res, rej) => {
                    const req = db
                        .transaction("workers", "readwrite")
                        .objectStore("workers")
                        .clear();
                    req.onsuccess = () => res();
                    req.onerror = () => rej(req.error);
                });
            }

            /* ============================================================
   Image helpers
============================================================ */
            const MAX_DIM = 1600;
            const JPEG_QUALITY = 0.85;

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            function compressImage(
                blob,
                maxDim = MAX_DIM,
                quality = JPEG_QUALITY,
            ) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = URL.createObjectURL(blob);
                    img.onload = () => {
                        URL.revokeObjectURL(url);
                        let { width, height } = img;
                        const scale = Math.min(
                            1,
                            maxDim / Math.max(width, height),
                        );
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = "high";
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(
                            (b) =>
                                b
                                    ? resolve(b)
                                    : reject(new Error("compress failed")),
                            "image/jpeg",
                            quality,
                        );
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error("image load failed"));
                    };
                    img.src = url;
                });
            }

            function canvasToBlob(
                canvas,
                type = "image/jpeg",
                quality = JPEG_QUALITY,
            ) {
                return new Promise((res, rej) =>
                    canvas.toBlob(
                        (b) => (b ? res(b) : rej(new Error("encode failed"))),
                        type,
                        quality,
                    ),
                );
            }

            function downscaleCanvas(src, maxDim) {
                const scale = Math.min(
                    1,
                    maxDim / Math.max(src.width, src.height),
                );
                if (scale >= 1) return src;
                const c = document.createElement("canvas");
                c.width = Math.round(src.width * scale);
                c.height = Math.round(src.height * scale);
                const ctx = c.getContext("2d");
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
                ctx.drawImage(src, 0, 0, c.width, c.height);
                return c;
            }

            /* ---------- Sharpness scoring (variance of Laplacian) ----------
   Everything is scored at the same 320px width so the numbers
   are comparable regardless of source resolution.            */
            const SCORE_W = 320;

            function laplacianVariance(ctx, w, h) {
                const d = ctx.getImageData(0, 0, w, h).data;
                const gray = new Float32Array(w * h);
                for (let i = 0, j = 0; i < d.length; i += 4, j++) {
                    gray[j] =
                        0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                }
                let sum = 0,
                    sumSq = 0,
                    n = 0;
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const i = y * w + x;
                        const lap =
                            -4 * gray[i] +
                            gray[i - 1] +
                            gray[i + 1] +
                            gray[i - w] +
                            gray[i + w];
                        sum += lap;
                        sumSq += lap * lap;
                        n++;
                    }
                }
                if (!n) return 0;
                const mean = sum / n;
                return sumSq / n - mean * mean;
            }

            function scoreDrawable(drawable, sw, sh) {
                const c = document.createElement("canvas");
                c.width = SCORE_W;
                c.height = Math.max(1, Math.round((SCORE_W * sh) / sw));
                const ctx = c.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(drawable, 0, 0, c.width, c.height);
                return laplacianVariance(ctx, c.width, c.height);
            }

            async function scoreBlob(blob) {
                const bmp = await createImageBitmap(blob);
                try {
                    return scoreDrawable(bmp, bmp.width, bmp.height);
                } finally {
                    if (bmp.close) bmp.close();
                }
            }

            /* ---------- Camera track tuning ---------- */
            async function tuneTrack(track) {
                if (!track || !track.applyConstraints) return;
                let caps = {};
                try {
                    caps = track.getCapabilities ? track.getCapabilities() : {};
                } catch (e) {
                    caps = {};
                }

                const advanced = [];
                if (
                    caps.focusMode &&
                    caps.focusMode.indexOf("continuous") !== -1
                ) {
                    advanced.push({ focusMode: "continuous" });
                }
                if (
                    caps.exposureMode &&
                    caps.exposureMode.indexOf("continuous") !== -1
                ) {
                    advanced.push({ exposureMode: "continuous" });
                }
                if (
                    caps.whiteBalanceMode &&
                    caps.whiteBalanceMode.indexOf("continuous") !== -1
                ) {
                    advanced.push({ whiteBalanceMode: "continuous" });
                }
                if (!advanced.length) return;
                try {
                    await track.applyConstraints({ advanced });
                } catch (e) {
                    /* not supported */
                }
            }

            /* ---------- Capture: still photo + sharpest-of-burst ---------- */
            const BURST_FRAMES = 6;
            const BURST_GAP = 90; // ms between burst frames

            async function captureBestFrame(video, track) {
                if (!video || video.readyState < 2 || !video.videoWidth)
                    return null;

                const vw = video.videoWidth;
                const vh = video.videoHeight;

                let bestScore = -1;
                let bestBlob = null; // still-photo path
                let bestCanvas = null; // video-frame path

                // 1) Prefer the browser's real still-photo pipeline — full sensor
                //    resolution, autofocus + auto-exposure applied by the camera.
                if (track && typeof window.ImageCapture === "function") {
                    try {
                        const shot = await new ImageCapture(track).takePhoto();
                        bestScore = await scoreBlob(shot);
                        bestBlob = shot;
                    } catch (e) {
                        /* not supported / failed — fall back to burst */
                    }
                }

                // 2) Burst of frames off the live preview; keep the crispest one.
                const frame = document.createElement("canvas");
                frame.width = vw;
                frame.height = vh;
                const fctx = frame.getContext("2d", {
                    willReadFrequently: true,
                });

                for (let i = 0; i < BURST_FRAMES; i++) {
                    if (i) await sleep(BURST_GAP);
                    if (video.readyState < 2) continue;
                    fctx.drawImage(video, 0, 0, vw, vh);
                    const score = scoreDrawable(frame, vw, vh);
                    if (score > bestScore) {
                        bestScore = score;
                        bestBlob = null;
                        if (!bestCanvas) {
                            bestCanvas = document.createElement("canvas");
                            bestCanvas.width = vw;
                            bestCanvas.height = vh;
                        }
                        bestCanvas.getContext("2d").drawImage(frame, 0, 0);
                    }
                }

                if (bestCanvas) {
                    return canvasToBlob(
                        downscaleCanvas(bestCanvas, MAX_DIM),
                        "image/jpeg",
                        JPEG_QUALITY,
                    );
                }
                if (bestBlob) {
                    return compressImage(bestBlob, MAX_DIM, JPEG_QUALITY);
                }
                return null;
            }

            /* ============================================================
   Toast
============================================================ */
            function Toast({ msg }) {
                return (

            /* ============================================================

            /* ============================================================

            /* ============================================================
   View 2 — Camera
============================================================ */
            function CameraView({ worker, onComplete, onCancel, showToast }) {
                const [step, setStep] = useState("worker"); // worker | hand | saving
                const [camError, setCamError] = useState(null);
                const [flash, setFlash] = useState(false);
                const [ready, setReady] = useState(false);
                const [capturing, setCapturing] = useState(false);
                const videoRef = useRef(null);
                const streamRef = useRef(null);
                const capturedRef = useRef({ worker: null, hand: null });
                const busyRef = useRef(false);

                const stopStream = useCallback(() => {
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach((t) => t.stop());
                        streamRef.current = null;
                    }
                }, []);

                useEffect(() => {
                    let cancelled = false;
                    async function start() {
                        if (
                            !navigator.mediaDevices ||
                            !navigator.mediaDevices.getUserMedia
                        ) {
                            setCamError(
                                "Camera is not supported on this browser. Please use a modern mobile browser over HTTPS.",
                            );
                            return;
                        }
                        try {
                            const stream =
                                await navigator.mediaDevices.getUserMedia({
                                    audio: false,
                                    video: {
                                        facingMode: { ideal: "environment" },
                                        width: { ideal: 1920 },
                                        height: { ideal: 1080 },
                                        frameRate: { ideal: 30 },
                                    },
                                });
                            if (cancelled) {
                                stream.getTracks().forEach((t) => t.stop());
                                return;
                            }
                            streamRef.current = stream;

                            // Ask the camera for continuous AF / AE / AWB where supported.
                            await tuneTrack(stream.getVideoTracks()[0]);

                            const v = videoRef.current;
                            if (v) {
                                v.srcObject = stream;
                                try {
                                    await v.play();
                                } catch (e) {}
                            }
                        } catch (err) {
                            if (cancelled) return;
                            if (
                                err.name === "NotAllowedError" ||
                                err.name === "SecurityError"
                            ) {
                                setCamError(
                                    "Camera permission was denied. Please allow camera access in your browser settings, then tap Back and try again.",
                                );
                            } else if (err.name === "NotFoundError") {
                                setCamError("No camera found on this device.");
                            } else {
                                setCamError(
                                    "Could not start the camera: " +
                                        err.message,
                                );
                            }
                        }
                    }
                    start();
                    return () => {
                        cancelled = true;
                        stopStream();
                    };
                }, []);

                // Tap the preview to focus on that point (Android/Chrome).
                const handleTapFocus = async (e) => {
                    const track =
                        streamRef.current &&
                        streamRef.current.getVideoTracks()[0];
                    if (!track || !track.getCapabilities) return;
                    let caps;
                    try {
                        caps = track.getCapabilities();
                    } catch (err) {
                        return;
                    }
                    if (!caps.pointsOfInterest) return;

                    const rect = e.currentTarget.getBoundingClientRect();
                    const x = Math.min(
                        1,
                        Math.max(0, (e.clientX - rect.left) / rect.width),
                    );
                    const y = Math.min(
                        1,
                        Math.max(0, (e.clientY - rect.top) / rect.height),
                    );
                    try {
                        await track.applyConstraints({
                            advanced: [
                                {
                                    pointsOfInterest: [{ x, y }],
                                    focusMode: "single-shot",
                                },
                            ],
                        });
                        setTimeout(() => {
                            track
                                .applyConstraints({
                                    advanced: [{ focusMode: "continuous" }],
                                })
                                .catch(() => {});
                        }, 1800);
                    } catch (err) {
                        /* ignore */
                    }
                };

                const capture = async () => {
                    if (busyRef.current || camError || !ready) return;
                    busyRef.current = true;
                    setCapturing(true);

                    try {
                        setFlash(true);
                        setTimeout(() => setFlash(false), 320);

                        const track =
                            streamRef.current &&
                            streamRef.current.getVideoTracks()[0];
                        const blob = await captureBestFrame(
                            videoRef.current,
                            track,
                        );
                        if (!blob) throw new Error("no frame captured");

                        capturedRef.current[step] = blob;

                        if (step === "worker") {
                            setStep("hand");
                            showToast(
                                "Worker photo saved — now capture the hand",
                            );
                        } else {
                            setStep("saving");
                            await onComplete(
                                capturedRef.current.worker,
                                capturedRef.current.hand,
                            );
                        }
                    } catch (e) {
                        showToast("Capture failed — please retry");
                    } finally {
                        busyRef.current = false;
                        setCapturing(false);
                    }
                };

                const stageLabel =
                    step === "worker"
                        ? {
                              name: (
                                  <>
                                      Worker <em>photo</em>
                                  </>
                              ),
                              sub: "Frame the worker and capture",
                          }
                        : {
                              name: (
                                  <>
                                      Hand <em>photo</em>
                                  </>
                              ),
                              sub: "Frame the worker's hand and capture",
                          };

                const hint = camError
                    ? ""
                    : capturing
                      ? "Hold still — choosing the sharpest frame…"
                      : !ready
                        ? "Starting camera…"
                        : "Tap the preview to focus";

                return (
                    <div className="view cam-view">
                        <div className="cam-top">
                            <button className="cam-back" onClick={onCancel}>
                                ‹ Cancel
                            </button>
                            <div className="cam-step">
                                {step === "worker"
                                    ? "Step 1 of 2"
                                    : "Step 2 of 2"}
                            </div>
                        </div>

                        <div className="cam-stage-label">
                            <div className="cam-stage-name">
                                {stageLabel.name}
                            </div>
                            <div className="cam-stage-sub">
                                {worker.name} · {worker.deviceId}
                            </div>
                        </div>

                        <div className="cam-frame" onClick={handleTapFocus}>
                            {camError ? (
                                <div className="cam-off">{camError}</div>
                            ) : (
                                <video
                                    ref={videoRef}
                                    playsInline
                                    muted
                                    autoPlay
                                    onCanPlay={() => setReady(true)}
                                />
                            )}
                            <div
                                className={"flash" + (flash ? " on" : "")}
                            ></div>
                        </div>

                        <div className="cam-progress">
                            <div
                                className={
                                    "cam-dot" +
                                    (capturedRef.current.worker ? " done" : "")
                                }
                            ></div>
                            <div
                                className={
                                    "cam-dot" +
                                    (capturedRef.current.hand ? " done" : "")
                                }
                            ></div>
                        </div>

                        <div className="cam-hint">{hint}</div>

                        <div className="cam-controls">
                            <button
                                className="shutter"
                                onClick={capture}
                                disabled={
                                    !!camError ||
                                    !ready ||
                                    capturing ||
                                    step === "saving"
                                }
                                aria-label="Capture photo"
                            >
                                <div className="shutter-inner"></div>
                            </button>
                        </div>
                    </div>
                );
            }

            /* ============================================================
   View 3 — Worker list

                                            ) : (

                                                </div>
                                            )}
                                            <div className="thumb-tag">

                                            </div>
                                        </div>
                                        <div className="thumb">
                                            {w.handPhoto ? (
                                                <img
                                                    src={URL.createObjectURL(

                                                    )}
                                                    alt="Hand"
                                                />
                                            ) : (
                                                <div className="thumb-missing">
                                                    —
                                                </div>
                                            )}
                                            <div className="thumb-tag">
                                                Hand
                                            </div>
                                        </div>
                                    </div>
                                    <div className="worker-info">
                                        <div className="worker-name">

                                        </div>
                                        <div className="worker-meta">

                                        Delete

                                </div>
                            ))
                        )}
                    </div>
                );
            }

            /* ============================================================
   Root app
============================================================ */
            function App() {
                const [screen, setScreen] = useState("list"); // list | form | camera
                const [workers, setWorkers] = useState([]);
                const [pendingWorker, setPendingWorker] = useState(null);
                const [lastForm, setLastForm] = useState({
                    name: "",
                    device: "",
                });
                const [formKey, setFormKey] = useState(0);
                const [toast, setToast] = useState("");
                const [exporting, setExporting] = useState(false);
                const [deleteTarget, setDeleteTarget] = useState(null);
                const [confirmDeleteAll, setConfirmDeleteAll] = useState(false);
                const [menuOpen, setMenuOpen] = useState(false);
                const toastTimer = useRef(null);

                const showToast = useCallback((msg) => {
                    setToast(msg);
                    clearTimeout(toastTimer.current);
                    toastTimer.current = setTimeout(() => setToast(""), 2200);
                }, []);

                useEffect(() => {
                    idbGetAll()
                        .then((all) => {
                            const sorted = all.sort((a, b) => a.id - b.id);
                            setWorkers(sorted);
                        })
                        .catch(() => showToast("Could not load saved workers"));
                }, []);

                const refresh = useCallback(async () => {
                    const all = await idbGetAll();
                    setWorkers(all.sort((a, b) => a.id - b.id));
                }, []);

                const goForm = () => {
                    setLastForm({ name: "", device: "" });
                    setFormKey((k) => k + 1);
                    setScreen("form");
                };

                const handleFormSubmit = ({ name, deviceId }) => {
                    setLastForm({ name, device: deviceId });
                    setPendingWorker({ name, deviceId });
                    setScreen("camera");
                };

                const handleCaptureComplete = async (workerBlob, handBlob) => {
                    await idbAdd({
                        name: pendingWorker.name,
                        deviceId: pendingWorker.deviceId,
                        workerPhoto: workerBlob,
                        handPhoto: handBlob,
                        createdAt: Date.now(),
                    });
                    await refresh();
                    setPendingWorker(null);
                    setLastForm({ name: "", device: "" });
                    setFormKey((k) => k + 1);
                    setScreen("form");
                    showToast("Saved — ready for next worker");
                };

                const handleCaptureCancel = () => {
                    setPendingWorker(null);
                    setScreen("list");
                };

                const confirmDelete = async () => {
                    if (!deleteTarget) return;
                    try {
                        await idbDelete(deleteTarget.id);
                        await refresh();
                        showToast("Worker deleted");
                    } catch {
                        showToast("Delete failed");
                    }
                    setDeleteTarget(null);
                };

                const handleDeleteAll = async () => {
                    try {
                        await idbClear();
                        await refresh();
                        showToast("All workers deleted");
                    } catch {
                        showToast("Delete failed");
                    }
                    setConfirmDeleteAll(false);
                };

                const handleExport = async () => {
                    if (exporting) return;
                    setExporting(true);
                    try {
                        const zip = new JSZip();
                        const complete = workers.filter(
                            (w) => w.workerPhoto && w.handPhoto,
                        );
                        if (complete.length === 0) {
                            showToast("No complete workers to export");
                            setExporting(false);
                            return;
                        }
                        const manifest = [];
                        complete.forEach((w, i) => {
                            const n = String(i + 1);
                            const folder = zip.folder(n);
                            folder.file("worker.jpg", w.workerPhoto);
                            folder.file("hand.jpg", w.handPhoto);
                            manifest.push({
                                name: w.name,
                                deviceID: w.deviceId,
                                workerPhoto: n + "/worker.jpg",
                                hand: n + "/hand.jpg",
                            });
                        });
                        zip.file(
                            "workers.json",
                            JSON.stringify(manifest, null, 2),
                        );
                        const blob = await zip.generateAsync({
                            type: "blob",
                            compression: "DEFLATE",
                            compressionOptions: { level: 6 },
                        });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download =
                            "workers-" +
                            new Date().toISOString().slice(0, 10) +
                            ".zip";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 5000);
                        showToast(
                            "ZIP downloaded — " + complete.length + " workers",
                        );
                    } catch (e) {
                        showToast("Export failed: " + e.message);
                    }
                    setExporting(false);
                };

                return (
                    <div className="app">
                        <div className="header">
                            <div className="brand">Scale</div>
                            <div
                                style={{
                                    display: "flex",
                                    alignItems: "center",
                                    gap: 10,
                                }}
                            >
                                <button
                                    className={
                                        "chip" +
                                        (screen === "list"
                                            ? " active-chip"
                                            : "")
                                    }
                                    onClick={() => setScreen("list")}
                                >
                                    <b>{workers.length}</b> captured
                                </button>
                                {screen === "list" && (
                                    <div className="hdr-actions">
                                        <button
                                            className="menu-btn"
                                            onClick={() =>
                                                setMenuOpen((o) => !o)
                                            }
                                            aria-label="Options"
                                        >
                                            <svg
                                                width="16"
                                                height="16"
                                                viewBox="0 0 16 16"
                                                fill="currentColor"
                                                aria-hidden="true"
                                            >
                                                <circle
                                                    cx="2.5"
                                                    cy="8"
                                                    r="1.6"
                                                />
                                                <circle cx="8" cy="8" r="1.6" />
                                                <circle
                                                    cx="13.5"
                                                    cy="8"
                                                    r="1.6"
                                                />
                                            </svg>
                                        </button>
                                        {menuOpen && (
                                            <div className="menu">
                                                <button
                                                    onClick={() => {
                                                        setMenuOpen(false);
                                                        handleExport();
                                                    }}
                                                    disabled={
                                                        exporting ||
                                                        workers.length === 0
                                                    }
                                                >
                                                    {exporting
                                                        ? "Building ZIP…"
                                                        : "Export ZIP"}
                                                </button>
                                                <button
                                                    className="danger"
                                                    onClick={() => {
                                                        setMenuOpen(false);
                                                        setConfirmDeleteAll(
                                                            true,
                                                        );
                                                    }}
                                                    disabled={
                                                        workers.length === 0
                                                    }
                                                >
                                                    Delete All
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {screen === "list" && (
                            <WorkerList
                                workers={workers}
                                onDelete={setDeleteTarget}
                            />
                        )}

                        {screen === "form" && (
                            <WorkerForm
                                key={formKey}
                                onSubmit={handleFormSubmit}
                                initialName={lastForm.name}
                                initialDevice={lastForm.device}
                            />
                        )}

                        {screen === "list" && (
                            <div className="bottom-bar">
                                <div className="bottom-bar-inner">
                                    <button
                                        className="btn-new"
                                        onClick={goForm}
                                    >
                                        + New Worker
                                    </button>
                                </div>
                            </div>
                        )}

                        {screen === "camera" && pendingWorker && (
                            <CameraView
                                worker={pendingWorker}
                                onComplete={handleCaptureComplete}
                                onCancel={handleCaptureCancel}
                                showToast={showToast}
                            />
                        )}

                        {menuOpen && (
                            <div
                                style={{
                                    position: "fixed",
                                    inset: 0,
                                    zIndex: 50,
                                }}
                                onClick={() => setMenuOpen(false)}
                            ></div>
                        )}

                        {confirmDeleteAll && (
                            <div
                                className="sheet-backdrop"
                                onClick={() => setConfirmDeleteAll(false)}
                            >
                                <div
                                    className="sheet"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="sheet-title">
                                        Delete all workers?
                                    </div>
                                    <div className="sheet-sub">
                                        This permanently removes all{" "}
                                        {workers.length} workers, their photos
                                        and metadata from this device. This
                                        cannot be undone.
                                    </div>
                                    <button
                                        className="btn-danger"
                                        onClick={handleDeleteAll}
                                    >
                                        Delete Everything
                                    </button>
                                    <button
                                        className="btn-ghost"
                                        onClick={() =>
                                            setConfirmDeleteAll(false)
                                        }
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}

                        {deleteTarget && (
                            <div
                                className="sheet-backdrop"
                                onClick={() => setDeleteTarget(null)}
                            >
                                <div
                                    className="sheet"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="sheet-title">
                                        Delete {deleteTarget.name}?
                                    </div>
                                    <div className="sheet-sub">
                                        This permanently removes both photos and
                                        the record from this device.
                                    </div>
                                    <button
                                        className="btn-danger"
                                        onClick={confirmDelete}
                                    >
                                        Delete Permanently
                                    </button>
                                    <button
                                        className="btn-ghost"
                                        onClick={() => setDeleteTarget(null)}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        )}

                        <Toast msg={toast} />
                    </div>
                );
            }

            ReactDOM.createRoot(document.getElementById("root")).render(
                <App />,
            );
        </script>
    </body>
</html>
